version: '3.8'

services:
  disney-backend:
    build: 
      context: ../backend-disney
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    env_file:
      - ../backend-disney/.env
    networks:
      - disney-network
    restart: always

  disney-frontend:
    build: 
      context: ../frontend-disney
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    env_file:
      - ../frontend-disney/.env.local
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
    networks:
      - disney-network
    depends_on:
      - disney-backend
    restart: always

networks:
  disney-network:
    driver: bridge